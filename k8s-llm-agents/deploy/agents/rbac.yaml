# Humans steer Claude sessions through claude.ai, not the cluster. Cluster
# access is limited to attaching to the agent's tmux (first login, debugging,
# non-Claude agents). Bind it to an OIDC group, never to a static kubeconfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-operator
  namespace: agents
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    verbs: [get, update, patch]   # kill switch: scale to 0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-operator
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:agent-operators
